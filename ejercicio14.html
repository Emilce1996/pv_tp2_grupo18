<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 14</title>
</head>
<body>
  <script>
    
    const duplicar = (arr) => arr.map(num => num * 2);

    
    const cantidad = parseInt(prompt("¿Cuántos números vas a ingresar?"));
    let numeros = [];

    
    for (let i = 0; i < cantidad; i++) {
      const valor = parseInt(prompt(`Ingrese el número ${i+1}`));
      numeros.push(valor);
    }

    
    const resultado = duplicar(numeros);
    document.write(`<p>Arreglo original: ${numeros.join(", ")}</p>`);
    document.write(`<p>Arreglo duplicado: ${resultado.join(", ")}</p>`);
  </script>
</body>
</html>
