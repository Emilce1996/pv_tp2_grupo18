<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 24</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            text-align: center;
            padding: 30px;
        }

        .contenedor {
            background: white;
            padding: 20px;
            border-radius: 10px;
            width: 400px;
            margin: auto;
            box-shadow: 0px 0px 10px gray;
        }

        h2 {
            color: #333;
        }

        .resultado {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: blue;
        }

        label {
            display: block;
            margin: 10px;
            font-size: 18px;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <h2>Selecciona un lenguaje</h2>

        <label>
            <input type="radio" name="lenguaje" value="JavaScript">
            JavaScript
        </label>

        <label>
            <input type="radio" name="lenguaje" value="Python">
            Python
        </label>

        <label>
            <input type="radio" name="lenguaje" value="Java">
            Java
        </label>

        <p id="resultado" class="resultado">No seleccionaste nada</p>
    </div>

    <script type="module" src="js/ejercicio24.js"></script>
</body>
</html>
