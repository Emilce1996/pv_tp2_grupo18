<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Ejercicio 11</title>
</head>
<body>
  <script>
    const km = parseFloat(prompt("Ingrese los kilómetros recorridos:"));
    const litros = parseFloat(prompt("Ingrese los litros consumidos:"));

    const consumo = litros / km;

    document.write(`<p>Consumo de combustible: ${consumo.toFixed(2)} litros/km</p>`);
  </script>
</body>
</html>
